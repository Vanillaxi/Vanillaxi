<svg class="animated-signature" width="337" height="112" viewBox="0 0 337 112" xmlns="http://www.w3.org/2000/svg">
  <style>
    .animated-signature {
      --signature-color: #111111;
    }

    @media (prefers-color-scheme: dark) {
      .animated-signature {
        --signature-color: #e6e6e6;
      }
    }

    .signature-word {
      stroke: var(--signature-color);
      stroke-width: 1.45;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: transparent;
      stroke-dasharray: 4200;
      stroke-dashoffset: 4200;
      animation: writeWord 6.4s ease-in-out infinite both;
    }

    .signature-flourish {
      stroke: var(--signature-color);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      stroke-dasharray: 900;
      stroke-dashoffset: 900;
      animation: writeFlourish 6.4s ease-in-out infinite both;
    }

    @keyframes writeWord {
      0%, 7% {
        stroke-dashoffset: 4200;
        fill: transparent;
      }
      39% {
        stroke-dashoffset: 0;
        fill: transparent;
      }
      46%, 78% {
        stroke-dashoffset: 0;
        fill: var(--signature-color);
      }
      91%, 100% {
        stroke-dashoffset: 4200;
        fill: transparent;
      }
    }

    @keyframes writeFlourish {
      0%, 34% {
        stroke-dashoffset: 900;
        opacity: 0;
      }
      42% {
        opacity: 1;
      }
      53%, 78% {
        stroke-dashoffset: 0;
        opacity: 1;
      }
      91%, 100% {
        stroke-dashoffset: 900;
        opacity: 0;
      }
    }
  </style>

